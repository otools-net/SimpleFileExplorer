<header class="reading-panel-head">
    <strong>
        @if (profile() === 'prose') {
            <ng-container i18n>Reading settings for text</ng-container>
        } @else {
            <ng-container i18n>Reading settings for code</ng-container>
        }
    </strong>
    <button
        type="button"
        class="icon-button ghost small"
        title="Close the reading settings (Esc)."
        i18n-title
        aria-label="Close"
        i18n-aria-label
        (click)="closed.emit()"
    ><svg sfeIcon="close"></svg></button>
</header>
<label class="reading-field">
    <span i18n="the font of the text">Font</span>
    <select (change)="set('font', $any($event.target).value)">
        @for (font of fonts; track font.id) {
            <option [value]="font.id" [selected]="font.id === own().font">{{ font.label }}</option>
        }
    </select>
</label>
@if (own().font === 'custom') {
    <label class="reading-field">
        <span i18n>Font name</span>
        <input
            type="text"
            maxlength="100"
            placeholder="Fira Code, for example"
            i18n-placeholder
            [value]="reading.preferences().customFont"
            title="Type the name of a font installed on this device."
            i18n-title
            (input)="reading.setCustomFont($any($event.target).value)"
        >
    </label>
}
<div class="reading-field">
    <span i18n="the size of the text">Size</span>
    <div class="reading-size">
        <button
            type="button"
            class="icon-button small"
            title="Make the text smaller (Ctrl+−)."
            i18n-title
            aria-label="Smaller"
            i18n-aria-label="make the text smaller"
            [disabled]="own().size <= sizes.min"
            (click)="reading.changeSize(profile(), -1)"
        >A−</button>
        <output aria-live="polite">{{ texts.size(own().size) }}</output>
        <button
            type="button"
            class="icon-button small"
            title="Make the text larger (Ctrl+=)."
            i18n-title
            aria-label="Larger"
            i18n-aria-label="make the text larger"
            [disabled]="own().size >= sizes.max"
            (click)="reading.changeSize(profile(), 1)"
        >A+</button>
    </div>
</div>
<label class="reading-field">
    <span i18n>Line height</span>
    <select (change)="set('lineHeight', +$any($event.target).value)">
        @for (value of lineHeights; track value) {
            <option [value]="value" [selected]="value === own().lineHeight">{{ value }}</option>
        }
    </select>
</label>
<label class="reading-field">
    <span i18n="the width of the text">Width</span>
    <select
        title="How long a line can get when long lines wrap."
        i18n-title
        (change)="set('width', +$any($event.target).value)"
    >
        @for (value of widths; track value) {
            <option
                [value]="value"
                [selected]="value === own().width"
            >{{ texts.width(value) }}</option>
        }
    </select>
</label>
<label class="reading-field">
    <span i18n>Margins</span>
    <select (change)="set('padding', +$any($event.target).value)">
        @for (value of paddings; track value) {
            <option [value]="value" [selected]="value === own().padding">{{ texts.margin(value) }}</option>
        }
    </select>
</label>
<label class="reading-check"><input
    type="checkbox"
    [checked]="own().wrap"
    (change)="set('wrap', $any($event.target).checked)"
><span i18n>Wrap long lines</span></label>
<label class="reading-check"><input
    type="checkbox"
    [checked]="own().lineNumbers"
    (change)="set('lineNumbers', $any($event.target).checked)"
><span i18n>Line numbers</span></label>
<div class="reading-field">
    <span i18n="the colours of the text and its page">Colours</span>
    <div class="reading-themes" role="radiogroup" aria-label="Colours" i18n-aria-label>
        @for (theme of themes; track theme.id) {
            <button
                type="button"
                role="radio"
                class="reading-theme"
                [attr.data-reader-theme]="theme.id"
                [class.active]="theme.id === reading.preferences().theme"
                [attr.aria-checked]="theme.id === reading.preferences().theme"
                [title]="theme.title"
                (click)="setTheme(theme.id)"
            >{{ theme.label }}</button>
        }
    </div>
</div>
<footer class="reading-panel-foot">
    <button
        type="button"
        class="button small"
        title="Put these settings and the colours back to your defaults."
        i18n-title
        (click)="reading.reset(profile())"
        i18n="put the reading settings back to the defaults"
    >Reset</button>
    @if (reading.canSaveDefaults()) {
        <button
            type="button"
            class="button small"
            data-save-defaults
            [sfeBusy]="saving()"
            [disabled]="saving() || !reading.changed()"
            title="Use these settings and colours, for text and code, in every browser you sign in from."
            i18n-title
            (click)="saveDefaults()"
            i18n
        >Save as my default</button>
    }
</footer>
