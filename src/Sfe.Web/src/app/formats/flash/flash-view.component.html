    <div class="text-toolbar" role="toolbar" aria-label="Flash movie" sfeOverflowRow="Flash movie">
        <button
            type="button"
            class="icon-button"
            data-play
            [sfeOverflowItem]="null"
            overflowStay
            [disabled]="state() !== 'ready'"
            [title]="playing() ? 'Pause' : 'Play'"
            [attr.aria-label]="playing() ? 'Pause' : 'Play'"
            (click)="togglePlay()"
        ><svg [sfeIcon]="playing() ? 'pause' : 'play'"></svg></button>
        <button
            type="button"
            class="icon-button"
            data-restart
            [sfeOverflowItem]="more.restart"
            [disabled]="state() !== 'ready'"
            title="Play again from the start"
            aria-label="Play again from the start"
            (click)="restart()"
        ><svg sfeIcon="refresh"></svg></button>
        <button
            type="button"
            class="icon-button"
            data-mute
            [sfeOverflowItem]="null"
            overflowStay
            [class.active]="muted()"
            [attr.aria-pressed]="muted()"
            [title]="muted() ? 'Sound on' : 'Mute'"
            [attr.aria-label]="muted() ? 'Sound on' : 'Mute'"
            (click)="toggleMute()"
        ><svg [sfeIcon]="muted() || volume() === 0 ? 'muted' : 'volume'"></svg></button>
        <input
            type="range"
            class="flash-volume"
            data-volume
            [sfeOverflowItem]="null"
            min="0"
            max="1"
            step="0.05"
            aria-label="Volume"
            title="Volume"
            [value]="volume()"
            (input)="setVolume($any($event.target).valueAsNumber)"
        />
        <button
            type="button"
            class="icon-button"
            data-fullscreen
            [sfeOverflowItem]="null"
            overflowStay
            [disabled]="state() !== 'ready'"
            title="Full screen"
            aria-label="Full screen"
            (click)="fullscreen()"
        ><svg sfeIcon="fullscreen"></svg></button>
        <button class="icon-button" sfeOverflowMore></button>
    </div>
    <!-- Always there: the grid's second row (the text views' editing bar), so that the movie takes the third. -->
    <div class="pdf-messages">
        @switch (state()) {
            @case ('loading') {
                <p class="text-message">Loading…</p>
            }
            @case ('failed') {
                <div class="text-message">
                    <p>{{ message() }}</p>
                    @if (downloadUrl(); as url) {
                        <p><a class="button" [href]="url"><svg sfeIcon="download"></svg> Download</a></p>
                    }
                </div>
            }
        }
    </div>
    <div #stage class="flash-stage" [hidden]="state() === 'failed'" [attr.aria-label]="item().name"></div>
    @if (state() === 'ready') {
        <footer class="text-status" aria-live="polite">
            <span>{{ details() }}</span>
            <span data-playing>{{ playing() ? 'Playing' : 'Paused' }}</span>
        </footer>
    }
