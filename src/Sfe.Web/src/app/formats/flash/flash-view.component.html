    <div
        class="text-toolbar"
        role="toolbar"
        aria-label="Flash movie"
        i18n-aria-label
        sfeOverflowRow="Flash movie"
        i18n-sfeOverflowRow
    >
        <button
            type="button"
            class="icon-button"
            data-play
            [sfeOverflowItem]="null"
            overflowStay
            [disabled]="state() !== 'ready'"
            [title]="texts.playHint(playing())"
            [attr.aria-label]="texts.play(playing())"
            (click)="togglePlay()"
        ><svg [sfeIcon]="playing() ? 'pause' : 'play'"></svg></button>
        <button
            type="button"
            class="icon-button"
            data-restart
            [sfeOverflowItem]="more.restart"
            [disabled]="state() !== 'ready'"
            title="Play the movie again from the start."
            i18n-title
            aria-label="Play again"
            i18n-aria-label
            (click)="restart()"
        ><svg sfeIcon="refresh"></svg></button>
        <button
            type="button"
            class="icon-button"
            data-mute
            [sfeOverflowItem]="null"
            overflowStay
            [class.active]="muted()"
            [attr.aria-pressed]="muted()"
            [title]="texts.muteHint(muted())"
            [attr.aria-label]="texts.mute(muted())"
            (click)="toggleMute()"
        ><svg [sfeIcon]="muted() || volume() === 0 ? 'muted' : 'volume'"></svg></button>
        <input
            type="range"
            class="flash-volume"
            data-volume
            [sfeOverflowItem]="null"
            min="0"
            max="1"
            step="0.05"
            aria-label="Volume"
            i18n-aria-label
            title="Set how loud the movie plays."
            i18n-title
            [value]="volume()"
            (input)="setVolume($any($event.target).valueAsNumber)"
        />
        <button
            type="button"
            class="icon-button"
            data-fullscreen
            [sfeOverflowItem]="null"
            overflowStay
            [disabled]="state() !== 'ready'"
            title="Show the movie on the whole screen."
            i18n-title
            aria-label="Full screen"
            i18n-aria-label
            (click)="fullscreen()"
        ><svg sfeIcon="fullscreen"></svg></button>
        <button class="icon-button" sfeOverflowMore></button>
    </div>
    <!-- Always there: the grid's second row (the text views' editing bar), so that the movie takes the third. -->
    <div class="pdf-messages">
        @switch (state()) {
            @case ('loading') {
                <p class="text-message" i18n>Loading…</p>
            }
            @case ('failed') {
                <div class="text-message">
                    <p>{{ message() }}</p>
                    @if (downloadUrl(); as url) {
                        <p><a class="button" [href]="url"
                            ><svg sfeIcon="download"></svg><ng-container i18n>Download</ng-container></a></p>
                    }
                </div>
            }
        }
    </div>
    <div #stage class="flash-stage" [hidden]="state() === 'failed'" [attr.aria-label]="item().name"></div>
    @if (state() === 'ready') {
        <footer class="text-status" aria-live="polite">
            <span>{{ details() }}</span>
            <span data-playing>{{ texts.state(playing()) }}</span>
        </footer>
    }
