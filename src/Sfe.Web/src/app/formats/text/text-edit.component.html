    @if (session.canEdit()) {
        @if (!session.editing()) {
            <button
                type="button"
                class="text-action"
                data-edit
                title="Change the text (E)."
                i18n-title
                (click)="session.startEdit()"
            ><svg sfeIcon="edit"></svg> <span i18n="start changing the text">Edit</span></button>
        } @else {
            @if (session.canSave()) {
                <!-- The same label while saving: a wider "Saving…" made the toolbar (an overflow row) measure itself again in a
                     loop on phones (ResizeObserver errors); the state shows as a busy button instead. -->
                <button
                    type="button"
                    class="text-action primary"
                    data-save
                    [class.saving]="session.saving()"
                    [attr.aria-busy]="session.saving() || null"
                    [title]="texts.saveHint(session.saving())"
                    [disabled]="!session.dirty() || session.saving()"
                    (click)="session.save()"
                >
                    <svg sfeIcon="save"></svg> <span i18n="save over the file">Save</span></button>
            }
            @if (session.access()?.saveCopy) {
                <button
                    type="button"
                    class="text-action"
                    data-save-copy
                    title="Save the text as a new file in this folder (Ctrl+Shift+S)."
                    i18n-title
                    [disabled]="session.saving()"
                    (click)="session.openCopy()"
                >
                    <svg sfeIcon="copy"></svg> <span class="text-action-label" i18n>Save a copy</span></button>
            }
            @if (session.access()?.download) {
                <button
                    type="button"
                    class="icon-button"
                    data-download-text
                    title="Download the text as it is now, with your changes."
                    i18n-title
                    aria-label="Download the text"
                    i18n-aria-label
                    (click)="session.download()"
                ><svg sfeIcon="download"></svg></button>
            }
            <button
                type="button"
                class="text-action"
                data-done
                title="Stop editing and go back to reading."
                i18n-title
                (click)="session.stopEdit()"
            ><svg sfeIcon="check"></svg> <span class="text-action-label" i18n="stop editing">Done</span></button>
        }
    }
