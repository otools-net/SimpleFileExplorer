<video
    #video
    [src]="playback().url"
    [poster]="poster() ?? ''"
    [loop]="looping() && !playback().streamed"
    preload="metadata"
    playsinline
    (play)="updatePlayState()"
    (pause)="updatePlayState(); waiting.set(false)"
    (ended)="onEnded()"
    (timeupdate)="updateTime()"
    (durationchange)="updateTime()"
    (progress)="updateTime()"
    (volumechange)="updateVolume()"
    (waiting)="waiting.set(true)"
    (playing)="waiting.set(false)"
    (canplay)="waiting.set(false)"
    (seeked)="waiting.set(false)"
    (error)="failed()"
    (loadedmetadata)="onMetadata()"
></video>
<div
    class="player-surface"
    (pointerdown)="onPointerDown($event)"
    (pointermove)="onPointerMove($event)"
    (pointerup)="onTap($event)"
    (pointercancel)="endHold()"
    (contextmenu)="onContextMenu($event)"
    (click)="onClick()"
    (dblclick)="onDoubleClick()"
></div>
<div #flash class="player-flash" aria-hidden="true"></div>
<div #hintBack class="player-hint back" aria-hidden="true"></div>
<div #hintForward class="player-hint forward" aria-hidden="true"></div>
<div class="player-fast" aria-hidden="true">{{ fastRate }}× <svg sfeIcon="fast"></svg></div>
<div class="player-spinner" aria-hidden="true"></div>
<button
    type="button"
    class="player-big-play"
    [attr.aria-label]="texts.play(true)"
    [title]="texts.playHint(true)"
    (click)="togglePlay()"
><svg sfeIcon="play"></svg></button>
<div class="player-controls" (pointerdown)="showControls()">
    <div class="player-seek-wrap">
        <input
            #seek
            type="range"
            class="player-seek"
            min="0"
            max="0"
            step="any"
            value="0"
            aria-label="Position in the video"
            i18n-aria-label
            (input)="onSeekInput()"
            (pointermove)="onSeekHover($event)"
            (pointerleave)="onSeekLeave()"
            (change)="endSeekPreview($event)"
            (pointerup)="endSeekPreview($event)"
            (pointercancel)="endSeekPreview($event)"
            (blur)="endSeekPreview($event)"
        >
        <div #preview class="player-preview" aria-hidden="true">
            <div #frame class="player-preview-frame"></div>
            <span #previewTime class="player-preview-time"></span>
        </div>
    </div>
    <!-- One line: what doesn't fit goes into the "⋯" menu, from the right; play, mute and fullscreen stay. -->
    <div class="player-row" sfeOverflowRow="Player controls" i18n-sfeOverflowRow>
        <button
            type="button"
            class="player-button player-seek-button"
            [sfeOverflowItem]="more.back"
            [title]="texts.backHint(seekStep())"
            [attr.aria-label]="texts.back(seekStep())"
            (click)="stepSeek(-1); showControls()"
        >
            <svg sfeIcon="rewind"></svg><span
                class="player-step"
                [class.long]="seekStep() >= 100"
                aria-hidden="true"
            >{{ seekStep() }}</span>
        </button>
        <button
            type="button"
            class="player-button"
            [sfeOverflowItem]="null"
            overflowStay
            [title]="texts.playHint(paused())"
            [attr.aria-label]="texts.play(paused())"
            (click)="togglePlay()"
        >
            <svg [sfeIcon]="paused() ? 'play' : 'pause'"></svg>
        </button>
        <button
            type="button"
            class="player-button player-seek-button"
            [sfeOverflowItem]="more.forward"
            [title]="texts.forwardHint(seekStep())"
            [attr.aria-label]="texts.forward(seekStep())"
            (click)="stepSeek(1); showControls()"
        >
            <svg sfeIcon="forward"></svg><span
                class="player-step"
                [class.long]="seekStep() >= 100"
                aria-hidden="true"
            >{{ seekStep() }}</span>
        </button>
        <!-- The length leaves first, alone: the time shortens before any button leaves. -->
        <span class="player-time" [sfeOverflowItem]="null" overflowStay>{{ timeParts()[0] }}</span>
        <span class="player-time-length" [sfeOverflowItem]="null" [overflowPriority]="-1">/ {{ timeParts()[1] }}</span>
        <div class="player-speed-wrap" [sfeOverflowItem]="more.speed">
            <button
                type="button"
                class="player-button player-speed"
                [title]="texts.speedHint()"
                [attr.aria-label]="texts.speed(speed())"
                aria-haspopup="true"
                [attr.aria-expanded]="speedMenu()"
                (click)="toggleSpeedMenu()"
            >{{ texts.rate(speed()) }}</button>
            @if (speedMenu()) {
                <!-- On phones a sheet at the bottom of the screen (phone-sheets.css). -->
                <div class="sheet-backdrop" aria-hidden="true" (click)="speedMenu.set(false)"></div>
                <div
                    class="player-speed-menu phone-sheet"
                    role="menu"
                    aria-label="Playback speed"
                    i18n-aria-label
                    [class.wide]="speedMenuHeight < 200"
                    [style.max-height.px]="speedMenuHeight"
                >
                    @for (rate of speeds; track rate) {
                        <button
                            type="button"
                            role="menuitemradio"
                            [class.on]="rate === speed()"
                            [attr.aria-checked]="rate === speed()"
                            [title]="texts.rateHint(rate)"
                            (click)="setSpeed(rate)"
                        >{{ texts.rate(rate) }}</button>
                    }
                </div>
            }
        </div>
        @if (stream() && !playback().streamed) {
            <button
                type="button"
                class="player-button player-convert"
                [sfeOverflowItem]="more.convert"
                [title]="texts.convertHint()"
                [attr.aria-label]="texts.convert()"
                (click)="useStream(); showControls()"
            >
                <svg sfeIcon="refresh"></svg>
            </button>
        }
        <button
            type="button"
            class="player-button player-toggle"
            [sfeOverflowItem]="more.loop"
            [class.on]="looping()"
            [title]="texts.loopHint(looping())"
            [attr.aria-label]="texts.loop(false)"
            [attr.aria-pressed]="looping()"
            (click)="toggleLoop(); showControls()"
        >
            <svg sfeIcon="loop"></svg>
        </button>
        <button
            type="button"
            class="player-button"
            [sfeOverflowItem]="more.saveFrame"
            [title]="texts.saveFrameHint()"
            [attr.aria-label]="texts.saveFrame()"
            (click)="saveFrame(); showControls()"
        >
            <svg sfeIcon="camera"></svg>
        </button>
        <button
            type="button"
            class="player-button"
            [sfeOverflowItem]="null"
            overflowStay
            [title]="texts.muteHint(muted())"
            [attr.aria-label]="texts.mute(muted())"
            (click)="toggleMute()"
        >
            <svg [sfeIcon]="muted() ? 'muted' : 'volume'"></svg>
        </button>
        @if (cinemaButton() && !fullscreen()) {
            <button
                type="button"
                class="player-button player-cinema"
                [sfeOverflowItem]="more.cinema"
                [title]="texts.cinemaHint(cinema())"
                [attr.aria-label]="texts.cinema(false)"
                [attr.aria-pressed]="cinema()"
                (click)="toggleCinema(); showControls()"
            >
                <svg [sfeIcon]="cinema() ? 'exit-cinema' : 'cinema'"></svg>
            </button>
        }
        <button
            type="button"
            class="player-button"
            [sfeOverflowItem]="null"
            overflowStay
            [title]="texts.fullScreenHint(fullscreen())"
            [attr.aria-label]="texts.fullScreen(fullscreen())"
            (click)="toggleFullscreen()"
        >
            <svg [sfeIcon]="fullscreen() ? 'exit-fullscreen' : 'fullscreen'"></svg>
        </button>
        <button class="player-button" sfeOverflowMore></button>
    </div>
</div>
