<sfe-sheet #sheet heading="Extract" i18n-heading variant="transfer-dialog">
    <p>{{ what() }}</p>
    <sfe-folder-browser [browser]="browser" />
    @if (refusal(); as refusal) {
        <p class="field-hint">{{ refusal }}</p>
    }
    <label class="check">
        <input
            type="checkbox"
            data-new-folder
            [checked]="newFolder()"
            (change)="newFolder.set(checked($event))"
        >
        <span><ng-container i18n>Into a new folder “{{ stem() }}”</ng-container><span class="field-hint" i18n>If the
        archive holds only one folder, the new folder takes that folder's name. Unchecked, what it holds goes in
        with what is there, asking about names taken.</span></span>
    </label>
    @if (!choice()?.unlock) {
        <label class="field">
            <span><ng-container i18n>Password </ng-container><span class="field-hint" i18n>only if the archive is
            protected by one</span></span>
            <input
                [type]="showPassword() ? 'text' : 'password'"
                data-extract-password
                autocomplete="off"
                [value]="password()"
                (input)="password.set(value($event))"
            >
        </label>
        <label class="check">
            <input type="checkbox" [checked]="showPassword()" (change)="showPassword.set(checked($event))">
            <span i18n>Show the password</span>
        </label>
    }
    <span sheetFooter class="spacer"></span>
    <button
        sheetFooter
        type="button"
        class="button"
        title="Close without extracting anything (Esc)"
        i18n-title
        (click)="sheet.close()"
        i18n
    >Cancel</button>
    <button
        sheetFooter
        type="button"
        class="button primary"
        data-extract
        [sfeBusy]="busy()"
        title="Extract into “{{ targetName() }}”. It goes on in the background."
        i18n-title
        [disabled]="busy() || refusal() !== null"
        (click)="confirm()"
        i18n
    >Extract here</button>
</sfe-sheet>
