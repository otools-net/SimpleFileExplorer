<section class="properties-section properties-access" aria-label="Access" i18n-aria-label>
    <h3 i18n>Access</h3>
    <ul class="access-lines">
        @for (line of lines(); track line.action) {
            <li [class.refused]="!line.allowed" [attr.data-action]="line.action">
                <svg [sfeIcon]="line.allowed ? 'check' : 'close'"></svg>
                <span class="visually-hidden">{{ line.allowed ? yes : no }}</span>
                <span class="access-label">{{ line.label }}</span>
                @if (line.reason) {
                    <span class="access-reason">{{ line.reason }}</span>
                }
            </li>
        }
    </ul>
    <dl class="properties">
        @if (rule(); as rule) {
            <dt i18n>Folder rule</dt><dd class="access-rule">{{ rule }}</dd>
        }
        <dt>{{ sideLabel() }}</dt><dd class="access-disk">{{ place() }}</dd>
    </dl>
</section>
