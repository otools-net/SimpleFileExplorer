
        <sfe-sheet #sheet [heading]="heading()" [subtitle]="subtitle()" (closed)="onClosed()">
            <form id="tag-editor-form" class="tag-form" novalidate (submit)="save($event)">
                <label class="field">
                    <span class="field-label" i18n>Name</span>
                    <input
                        #nameInput
                        type="text"
                        name="name"
                        required
                        maxlength="200"
                        autocomplete="off"
                        [value]="name()"
                        (input)="name.set(valueOf($event))"
                    >
                </label>
                <label class="field">
                    <span class="field-label" i18n>Shorthand</span>
                    <input
                        type="text"
                        name="shorthand"
                        maxlength="200"
                        autocomplete="off"
                        [value]="shorthand()"
                        (input)="shorthand.set(valueOf($event))"
                    >
                    <span class="field-hint" i18n>Found by searches like the name, and shown when this tag tells another one
                    apart.</span>
                </label>
                <label class="field">
                    <span class="field-label" i18n>Aliases</span>
                    <textarea
                        name="aliases"
                        rows="3"
                        spellcheck="false"
                        [value]="aliases()"
                        (input)="aliases.set(valueOf($event))"
                    ></textarea>
                    <span class="field-hint" i18n>Other names this tag goes by, one per line.</span>
                </label>
                <div class="field">
                    <span class="field-label" i18n>Parent tags</span>
                    <div class="tag-list" [hidden]="!parents().length">
                        @for (parent of parents(); track parent.id) {
                            <sfe-tag-chip [tag]="parent" [removable]="true" (remove)="removeParent($event)" />
                        }
                    </div>
                    <sfe-tag-picker placeholder="Add a parent tag…" i18n-placeholder [exclude]="excludeFromParents"
                                    [pick]="addParent" />
                    <span class="field-hint" i18n>This tag “is a” parent tag: files with it are also found by searching for its
                    parents.</span>
                </div>
                <label class="field">
                    <span class="field-label" i18n>Tell apart with</span>
                    <select
                        name="disambiguation"
                        [disabled]="!parents().length"
                        (change)="disambiguation.set(valueOf($event))"
                    >
                        <option value="" [selected]="!disambiguation()" i18n>None</option>
                        @for (parent of parents(); track parent.id) {
                            <option
                                [value]="parent.id"
                                [selected]="disambiguation() === '' + parent.id"
                            >{{ parent.displayName }}</option>
                        }
                    </select>
                    <span class="field-hint" i18n>Shows a parent after the name, for example “Freddy (FNAF)”.</span>
                </label>
                <div class="field">
                    <span class="field-label" i18n>Colour</span>
                    <div class="swatches" role="radiogroup" aria-label="Colour" i18n-aria-label>
                        @for (swatch of swatches(); track swatch.slug) {
                            <label
                                class="swatch"
                                [title]="swatch.name"
                                [style.--chip-bg]="swatch.hex"
                                [style.--chip-text]="swatch.text"
                            >
                                <input
                                    type="radio"
                                    name="color"
                                    [value]="swatch.slug"
                                    [attr.aria-label]="swatch.name"
                                    [checked]="color() === swatch.slug"
                                    (change)="color.set(swatch.slug)"
                                >
                                @if (!swatch.slug) {
                                    <svg sfeIcon="close"></svg>
                                }
                            </label>
                        }
                    </div>
                </div>
                <label class="check">
                    <input
                        type="checkbox"
                        name="isCategory"
                        [checked]="isCategory()"
                        (change)="isCategory.set(checkedOf($event))"
                    >
                    <span><strong i18n>Category</strong><span class="field-hint" i18n>Tags inheriting from this one are grouped
                        under it.</span></span>
                </label>
                <label class="check">
                    <input
                        type="checkbox"
                        name="isHidden"
                        [checked]="isHidden()"
                        (change)="isHidden.set(checkedOf($event))"
                    >
                    <span><strong i18n>Hidden</strong><span class="field-hint" i18n>Files with this tag are left out of search
                        results unless the search asks for it.</span></span>
                </label>
                @if (error()) {
                    <p class="form-error" role="alert">{{ error() }}</p>
                }
            </form>
            @if (tag() && !tag()!.isBuiltIn) {
                <button
                    sheetFooter
                    type="button"
                    class="button danger"
                    title="Delete this tag and remove it from its files (asks first)."
                    i18n-title
                    (click)="delete()"
                    i18n
                >Delete</button>
            }
            @if (tag()) {
                <button
                    sheetFooter
                    type="button"
                    class="button"
                    title="Search for the files with this tag."
                    i18n-title
                    (click)="find()"
                ><svg sfeIcon="search"></svg><ng-container i18n>Find files</ng-container></button>
            }
            <span sheetFooter class="spacer"></span>
            <button
                sheetFooter
                type="button"
                class="button"
                title="Close without saving."
                i18n-title
                (click)="sheet.close()"
                i18n
            >Cancel</button>
            <button
                sheetFooter
                type="submit"
                form="tag-editor-form"
                class="button primary"
                title="Save the tag."
                i18n-title
                [disabled]="saving()"
                i18n
            >Save</button>
        </sfe-sheet>
